<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="robots" content="noindex">
<title>Inscription membre — Syntonie asbl</title>
<style>
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0;}
:root{
  --u:60px;
  --paper:#F3EEE3;
  --sheet:#FBF8F1;
  --navy:#14233A;
  --ink:#1B2A40;
  --mid:#52607A;
  --line:#C9C2B2;
  --grid:rgba(20,35,58,0.06);
  --orange:#E8831A;
  --orange-dk:#B55F0A;
  --ok:#2F6B3A;
  --err:#A8321F;
  --f-body:'Atkinson Hyperlegible',system-ui,sans-serif;
  --f-display:'Spectral',Georgia,serif;
  --f-mono:'Syne Mono',ui-monospace,monospace;
}
html{font-size:17px;}
body{
  font-family:var(--f-body);color:var(--ink);line-height:1.55;min-height:100vh;
  background-color:var(--paper);
  background-image:linear-gradient(var(--grid) 1px,transparent 1px),linear-gradient(90deg,var(--grid) 1px,transparent 1px);
  background-size:var(--u) var(--u);
}
.top{background:var(--navy);color:#fff;display:flex;justify-content:space-between;align-items:center;gap:16px;padding:14px 20px;border-bottom:6px solid var(--orange);}
.brand{display:flex;align-items:baseline;gap:10px;}
.brand b{font-size:1.25rem;letter-spacing:-0.3px;}
.brand span{font-family:var(--f-mono);font-size:0.68rem;letter-spacing:1.5px;opacity:0.7;}
.langs{display:flex;border:1px solid rgba(255,255,255,0.4);}
.langs button{font-family:var(--f-mono);font-size:0.85rem;letter-spacing:1px;background:transparent;color:#fff;border:0;padding:10px 16px;min-width:52px;cursor:pointer;}
.langs button+button{border-left:1px solid rgba(255,255,255,0.4);}
.langs button[aria-pressed="true"]{background:var(--orange);color:var(--navy);font-weight:700;}
.demo{display:none;background:var(--orange);color:var(--navy);font-family:var(--f-mono);font-size:0.8rem;letter-spacing:1px;text-align:center;padding:8px 12px;}
.wrap{max-width:760px;margin:0 auto;padding:32px 16px 80px;}
.sheet{background:var(--sheet);border:1px solid var(--line);box-shadow:8px 8px 0 var(--navy);padding:36px 32px;}
h1{font-family:var(--f-display);font-size:2rem;line-height:1.15;color:var(--navy);margin-bottom:10px;}
.mission{color:var(--mid);font-size:0.95rem;max-width:60ch;margin-bottom:8px;}
.sec{margin-top:36px;padding-top:20px;border-top:2px solid var(--navy);}
.sec-h{display:flex;align-items:baseline;gap:12px;margin-bottom:18px;}
.sec-n{font-family:var(--f-mono);font-size:0.8rem;color:var(--orange-dk);letter-spacing:1px;}
h2{font-size:1.05rem;letter-spacing:1.2px;text-transform:uppercase;color:var(--navy);}
.row{display:grid;grid-template-columns:1fr 1fr;gap:16px;}
.f{margin-bottom:16px;}
label.l{display:block;font-weight:700;font-size:0.92rem;margin-bottom:6px;}
.opt{font-weight:400;color:var(--mid);font-size:0.85rem;}
input[type=text],input[type=email],input[type=tel],textarea{
  width:100%;font:inherit;color:var(--ink);background:#fff;border:1.5px solid var(--navy);border-radius:0;padding:12px 14px;min-height:50px;
}
textarea{min-height:96px;resize:vertical;}
input:focus-visible,textarea:focus-visible,button:focus-visible,a:focus-visible{outline:3px solid var(--orange);outline-offset:2px;}
input[aria-invalid="true"],textarea[aria-invalid="true"]{border-color:var(--err);background:#FFF6F3;}
.msg{display:none;color:var(--err);font-size:0.85rem;margin-top:5px;}
.msg.on{display:block;}
.check{display:flex;gap:14px;align-items:flex-start;padding:12px 0;cursor:pointer;}
.check input{flex:none;width:26px;height:26px;margin-top:1px;accent-color:var(--navy);cursor:pointer;}
.check span{font-size:0.98rem;}
.sub{display:none;border-left:4px solid var(--orange);padding:4px 0 0 16px;margin:4px 0 12px 12px;}
.sub.on{display:block;}
.fee{background:var(--navy);color:#fff;padding:18px 20px;display:flex;gap:18px;align-items:center;margin-bottom:8px;}
.fee-n{font-family:var(--f-mono);font-size:2rem;color:var(--orange);white-space:nowrap;}
.fee p{font-size:0.95rem;}
ol.terms{list-style:none;counter-reset:t;margin-bottom:12px;}
ol.terms li{counter-increment:t;position:relative;padding:0 0 14px 40px;font-size:0.95rem;max-width:68ch;}
ol.terms li::before{content:counter(t);position:absolute;left:0;top:0;width:26px;height:26px;background:var(--navy);color:#fff;font-family:var(--f-mono);font-size:0.8rem;display:flex;align-items:center;justify-content:center;}
.rules{display:none;margin-bottom:14px;font-size:0.95rem;}
.rules a{color:var(--orange-dk);font-weight:700;}
.agree{background:#fff;border:1.5px solid var(--navy);padding:4px 16px;margin-top:10px;}
.agree .check span{font-weight:700;}
.meta{font-family:var(--f-mono);font-size:0.8rem;color:var(--mid);margin-top:14px;}
.btn{font:inherit;font-weight:700;font-size:1.05rem;letter-spacing:0.5px;background:var(--orange);color:var(--navy);border:2px solid var(--navy);padding:16px 28px;min-height:58px;cursor:pointer;box-shadow:4px 4px 0 var(--navy);text-decoration:none;display:inline-block;}
.btn:active{transform:translate(2px,2px);box-shadow:2px 2px 0 var(--navy);}
.btn[disabled]{opacity:0.55;cursor:wait;}
.btn.ghost{background:transparent;box-shadow:none;font-weight:400;font-size:0.95rem;}
.actions{margin-top:32px;display:flex;flex-wrap:wrap;gap:16px;align-items:center;}
.formerr{display:none;color:var(--err);font-weight:700;margin-top:18px;}
.formerr.on{display:block;}
.hp{position:absolute;left:-9999px;width:1px;height:1px;overflow:hidden;}
#done,#pay{display:none;}
#code-f{display:none;}
.num{font-family:var(--f-mono);font-size:3.4rem;line-height:1;color:var(--navy);margin:8px 0 4px;}
.num-l{font-family:var(--f-mono);font-size:0.8rem;letter-spacing:1.5px;color:var(--mid);text-transform:uppercase;}
.step{border:1.5px solid var(--navy);background:#fff;padding:20px;margin-top:24px;}
.step h3{font-size:1.05rem;margin-bottom:8px;color:var(--navy);}
.step p{margin-bottom:12px;max-width:60ch;}
.alt{font-size:0.9rem;color:var(--mid);border-top:1px dashed var(--line);padding-top:12px;margin-top:16px;}
.alt code{font-family:var(--f-mono);color:var(--ink);background:var(--paper);padding:2px 6px;}
.qr{width:220px;max-width:100%;background:#fff;border:1.5px solid var(--navy);padding:6px;margin:4px 0 14px;}
.qr svg{display:block;width:100%;height:auto;}
.show{background:var(--paper);border-left:4px solid var(--orange);padding:12px 16px;margin-top:24px;font-weight:700;}
@media (max-width:600px){
  .row{grid-template-columns:1fr;gap:0;}
  .sheet{padding:24px 18px;box-shadow:5px 5px 0 var(--navy);}
  h1{font-size:1.6rem;}
  .brand span{display:none;}
  .fee{flex-direction:column;align-items:flex-start;gap:6px;}
  .num{font-size:2.6rem;}
}
@media (prefers-reduced-motion:reduce){.btn:active{transform:none;}}
</style>
</head>
<body>

<header class="top">
  <div class="brand"><b>Syntonie asbl</b><span>OPENFAB · IXELLES</span></div>
  <div class="langs" role="group" aria-label="Langue / Taal / Language">
    <button type="button" data-lang="fr" aria-pressed="true">FR</button>
    <button type="button" data-lang="nl" aria-pressed="false">NL</button>
    <button type="button" data-lang="en" aria-pressed="false">EN</button>
  </div>
</header>
<div class="demo" id="demo" data-i18n="demo"></div>

<div class="wrap">

  <!-- ============ FORMULAIRE ============ -->
  <form class="sheet" id="form" novalidate>
    <h1 data-i18n="title"></h1>
    <p class="mission" data-i18n="mission"></p>

    <section class="sec">
      <div class="sec-h"><span class="sec-n">01</span><h2 data-i18n="s1"></h2></div>
      <div class="f" id="code-f">
        <label class="l" for="code" data-i18n="code"></label>
        <input type="text" id="code" name="code" autocomplete="off" autocapitalize="off" maxlength="40" style="max-width:16rem">
        <p class="msg" data-i18n="err_code"></p>
        <p class="opt" data-i18n="code_hint"></p>
      </div>
      <div class="row">
        <div class="f">
          <label class="l" for="last_name" data-i18n="last_name"></label>
          <input type="text" id="last_name" name="last_name" autocomplete="family-name" required maxlength="100">
          <p class="msg" data-i18n="required"></p>
        </div>
        <div class="f">
          <label class="l" for="first_name" data-i18n="first_name"></label>
          <input type="text" id="first_name" name="first_name" autocomplete="given-name" required maxlength="100">
          <p class="msg" data-i18n="required"></p>
        </div>
      </div>
      <div class="row">
        <div class="f">
          <label class="l" for="email" data-i18n="email"></label>
          <input type="email" id="email" name="email" autocomplete="email" inputmode="email" autocapitalize="off" required maxlength="200">
          <p class="msg" data-i18n="bad_email"></p>
        </div>
        <div class="f">
          <label class="l" for="phone" data-i18n="phone"></label>
          <input type="tel" id="phone" name="phone" autocomplete="tel" required maxlength="40">
          <p class="msg" data-i18n="required"></p>
        </div>
      </div>
      <label class="check"><input type="checkbox" id="is_minor" name="is_minor" data-toggle="sub-minor"><span data-i18n="is_minor"></span></label>
      <div class="sub" id="sub-minor">
        <div class="f">
          <label class="l" for="guardian_name" data-i18n="guardian_name"></label>
          <input type="text" id="guardian_name" name="guardian_name" maxlength="200">
          <p class="msg" data-i18n="required"></p>
        </div>
      </div>
    </section>

    <section class="sec">
      <div class="sec-h"><span class="sec-n">02</span><h2 data-i18n="s2"></h2></div>
      <label class="check"><input type="checkbox" id="is_pro" data-toggle="sub-pro"><span data-i18n="is_pro"></span></label>
      <div class="sub" id="sub-pro">
        <div class="row">
          <div class="f">
            <label class="l" for="pro_name" data-i18n="pro_name"></label>
            <input type="text" id="pro_name" name="pro_name" autocomplete="organization" maxlength="200">
          </div>
          <div class="f">
            <label class="l" for="vat" data-i18n="vat"></label>
            <input type="text" id="vat" name="vat" placeholder="BE 0123.456.789" maxlength="40">
          </div>
        </div>
      </div>
      <label class="check"><input type="checkbox" id="is_smart" data-toggle="sub-smart"><span data-i18n="is_smart"></span></label>
      <div class="sub" id="sub-smart">
        <div class="f">
          <label class="l" for="smart" data-i18n="smart"></label>
          <input type="text" id="smart" name="smart" maxlength="200">
        </div>
      </div>
      <div class="f" style="margin-top:14px">
        <label class="l" for="interests"><span data-i18n="interests"></span> <span class="opt" data-i18n="optional"></span></label>
        <textarea id="interests" name="interests" maxlength="1000"></textarea>
      </div>
    </section>

    <section class="sec">
      <div class="sec-h"><span class="sec-n">03</span><h2 data-i18n="s3"></h2></div>
      <div class="fee">
        <div class="fee-n"><span class="fee-amount"></span> €</div>
        <p data-i18n="fee"></p>
      </div>
    </section>

    <section class="sec">
      <div class="sec-h"><span class="sec-n">04</span><h2 data-i18n="s4"></h2></div>
      <p style="margin-bottom:14px" data-i18n="terms_intro"></p>
      <ol class="terms">
        <li data-i18n="t1"></li>
        <li data-i18n="t2"></li>
        <li data-i18n="t3"></li>
        <li data-i18n="t4"></li>
      </ol>
      <p class="rules" id="rules"><a id="rules-link" target="_blank" rel="noopener" data-i18n="rules"></a></p>
      <div class="agree">
        <label class="check"><input type="checkbox" id="accepted" name="accepted" required><span data-i18n="accept"></span></label>
        <p class="msg" id="accepted-msg" data-i18n="must_accept"></p>
        <div id="guardian-agree" style="display:none">
          <label class="check"><input type="checkbox" id="guardian_accepted" name="guardian_accepted"><span data-i18n="accept_guardian"></span></label>
          <p class="msg" id="guardian-msg" data-i18n="must_accept"></p>
        </div>
      </div>
      <p class="meta"><span data-i18n="done_at"></span> <span id="today"></span> · <span data-i18n="version"></span> <span class="terms-version"></span></p>
    </section>

    <div class="hp" aria-hidden="true"><label>Website <input type="text" name="website" tabindex="-1" autocomplete="off"></label></div>

    <p class="formerr" id="formerr" role="alert"></p>
    <div class="actions">
      <button class="btn" type="submit" id="submit" data-i18n="submit"></button>
    </div>
  </form>

  <!-- ============ PAIEMENT (avant l'envoi) ============ -->
  <div class="sheet" id="pay" tabindex="-1">
    <h1><span data-i18n="pay_title"></span> — <span class="fee-amount"></span> €</h1>
    <p data-i18n="pay_intro"></p>

    <div class="step">
      <p data-i18n="pay_qr"></p>
      <div class="qr" id="qr" role="img" aria-label="QR SEPA"></div>
      <p class="alt"><span data-i18n="pay_alt"></span> <code class="iban"></code><br><span data-i18n="pay_comm"></span> <code id="ok-comm"></code></p>
    </div>

    <p class="formerr" id="payerr" role="alert"></p>
    <div class="actions">
      <button class="btn" type="button" data-pay="transfer" data-i18n="paid_transfer"></button>
      <button class="btn" type="button" data-pay="desk" data-i18n="paid_desk"></button>
    </div>
    <div class="actions" style="margin-top:16px">
      <button class="btn ghost" type="button" id="back" data-i18n="back"></button>
    </div>
  </div>

  <!-- ============ CONFIRMATION ============ -->
  <div class="sheet" id="done" tabindex="-1">
    <h1 data-i18n="ok_title"></h1>
    <p><span id="ok-name"></span></p>
    <p style="margin-top:10px" data-i18n="no_note"></p>
    <p class="show" data-i18n="show"></p>
    <div class="actions">
      <button class="btn ghost" type="button" id="again" data-i18n="again"></button>
    </div>
  </div>

</div>

<script src="qrcode.js"></script>

                   banques comparent ce nom à l'IBAN).

const $ = (id) => document.getElementById(id);
const form = $("form");
let lang = "fr";
let last = null;    // personne en cours d'inscription (nom, année)
let pending = null; // fiche vérifiée, pas encore envoyée

function t(key){ return I18N[lang][key] || I18N.fr[key] || key; }

function setLang(l){
  lang = I18N[l] ? l : "fr";
  document.documentElement.lang = lang;
  document.querySelectorAll("[data-i18n]").forEach(el => { el.textContent = t(el.dataset.i18n); });
  document.querySelectorAll(".langs button").forEach(b => b.setAttribute("aria-pressed", String(b.dataset.lang === lang)));
  document.title = t("title") + " — Syntonie asbl";
  $("today").textContent = CONFIG.PLACE + ", " + new Date().toLocaleDateString(lang + "-BE");
  if (last) { renderPay(); renderDone(); }
}

function toggleSub(box){
  const sub = $(box.dataset.toggle);
  sub.classList.toggle("on", box.checked);
  if (!box.checked) sub.querySelectorAll("input").forEach(i => { i.value = ""; mark(i, true); });
  if (box.id === "is_minor") {
    $("guardian-agree").style.display = box.checked ? "block" : "none";
    if (!box.checked) $("guardian_accepted").checked = false;
  }
}

function mark(input, ok){
  input.setAttribute("aria-invalid", String(!ok));
  const msg = input.closest(".f") && input.closest(".f").querySelector(".msg");
  if (msg) msg.classList.toggle("on", !ok);
  return ok;
}

function validate(){
  let first = null;
  const check = (input, ok) => { if (!mark(input, ok) && !first) first = input; };
  const v = (id) => $(id).value.trim();
  check($("last_name"), v("last_name") !== "");
  check($("first_name"), v("first_name") !== "");
  check($("email"), /^[^\s@]+@[^\s@]+\.[^\s@]{2,}$/.test(v("email")));
  check($("phone"), v("phone") !== "");
  if ($("is_minor").checked) check($("guardian_name"), v("guardian_name") !== "");
  const acc = $("accepted").checked;
  $("accepted-msg").classList.toggle("on", !acc);
  if (!acc && !first) first = $("accepted");
  if ($("is_minor").checked) {
    const g = $("guardian_accepted").checked;
    $("guardian-msg").classList.toggle("on", !g);
    if (!g && !first) first = $("guardian_accepted");
  }
  return first;
}

function payload(){
  const v = (id) => $(id).value.trim();
  return {
    lang,
    last_name: v("last_name"), first_name: v("first_name"),
    email: v("email").toLowerCase(), phone: v("phone"),
    is_minor: $("is_minor").checked, guardian_name: v("guardian_name"),
    pro_name: v("pro_name"), vat: v("vat"), smart: v("smart"),
    interests: v("interests"), code: v("code"),
    accepted: $("accepted").checked, guardian_accepted: $("guardian_accepted").checked,
    terms_version: CONFIG.TERMS_VERSION, place: CONFIG.PLACE,
    website: form.elements.website.value
  };
}

async function post(path, data){
  const res = await fetch(path, {
    method: "POST", headers: { "Content-Type": "application/json" }, body: JSON.stringify(data)
  });
  if (!res.ok) { const e = new Error("HTTP " + res.status); e.status = res.status; throw e; }
  return res.json();
}

// Communication du virement : toujours la même forme, pour retrouver le paiement.
function comm(){ return ("Cotisation " + last.year + " " + last.last_name + " " + last.first_name).slice(0, 140); }

// QR de virement SEPA (norme EPC069-12, version 002) : lu par les applications bancaires.
function epc(){
  return ["BCD", "002", "1", "SCT", "", CONFIG.PAYEE.slice(0, 70), CONFIG.IBAN.replace(/\s/g, ""),
    "EUR" + CONFIG.FEE.toFixed(2), "", "", comm(), ""].join("\n");
}

function renderPay(){
  $("ok-comm").textContent = comm();
  qrcode.stringToBytes = qrcode.stringToBytesFuncs["UTF-8"];
  const qr = qrcode(0, "M");
  qr.addData(epc(), "Byte");
  qr.make();
  $("qr").innerHTML = qr.createSvgTag({ cellSize: 4, margin: 4, scalable: true });
}

function renderDone(){
  $("ok-name").textContent = t("welcome") + " " + last.first_name + " " + last.last_name + ".";
}

function show(id){
  ["form", "pay", "done"].forEach(x => { $(x).style.display = x === id ? "block" : "none"; });
  window.scrollTo(0, 0);
  if (id !== "form") $(id).focus();
}

// Étape 1 : la fiche est vérifiée, rien n'est encore envoyé à l'équipe.
form.addEventListener("submit", async (e) => {
  e.preventDefault();
  const err = $("formerr");
  err.classList.remove("on");
  const bad = validate();
  if (bad) {
    err.textContent = t("err_fields"); err.classList.add("on");
    bad.focus(); bad.scrollIntoView({ block: "center" });
    return;
  }
  const btn = $("submit");
  btn.disabled = true; btn.textContent = t("sending");
  const data = payload();
  try {
    await post(CONFIG.CHECK_URL, data);
    pending = data;
    last = { year: new Date().getFullYear(), first_name: data.first_name, last_name: data.last_name };
    renderPay(); renderDone();
    $("payerr").classList.remove("on");
    show("pay");
  } catch (ex) {
    err.textContent = t(ex.status === 403 ? "err_code" : "err_net"); err.classList.add("on");
    if (ex.status === 403) { mark($("code"), false); $("code").focus(); }
  } finally {
    btn.disabled = false; btn.textContent = t("submit");
  }
});

// Étape 2 : la fiche part quand la personne déclare son paiement.
const payBtns = document.querySelectorAll("[data-pay]");
payBtns.forEach(b => b.addEventListener("click", async () => {
  const err = $("payerr");
  err.classList.remove("on");
  payBtns.forEach(x => { x.disabled = true; });
  try {
    await post(CONFIG.API_URL, Object.assign({}, pending, { payment: b.dataset.pay }));
    pending = null;
    show("done");
  } catch (ex) {
    err.textContent = t("err_net"); err.classList.add("on");
  } finally {
    payBtns.forEach(x => { x.disabled = false; });
  }
}));
$("back").addEventListener("click", () => show("form"));

$("again").addEventListener("click", () => {
  last = null;
  form.reset();
  document.querySelectorAll("[data-toggle]").forEach(toggleSub);
  document.querySelectorAll("[aria-invalid]").forEach(i => mark(i, true));
  document.querySelectorAll(".msg.on").forEach(m => m.classList.remove("on"));
  pending = null;
  show("form");
  (CONFIG.NEED_CODE ? $("code") : $("last_name")).focus();
});

document.querySelectorAll("[data-toggle]").forEach(b => b.addEventListener("change", () => toggleSub(b)));
document.querySelectorAll(".langs button").forEach(b => b.addEventListener("click", () => setLang(b.dataset.lang)));
form.querySelectorAll("input[required], #guardian_name, #code").forEach(i => i.addEventListener("input", () => {
  if (i.getAttribute("aria-invalid") === "true") mark(i, true);
}));

[["accepted", "accepted-msg"], ["guardian_accepted", "guardian-msg"]].forEach(([box, msg]) => {
  $(box).addEventListener("change", () => { if ($(box).checked) $(msg).classList.remove("on"); });
});
form.addEventListener("input", () => $("formerr").classList.remove("on"));

// Initialisation
document.querySelectorAll(".fee-amount").forEach(el => { el.textContent = CONFIG.FEE; });
document.querySelectorAll(".iban").forEach(el => { el.textContent = CONFIG.IBAN; });
document.querySelectorAll(".terms-version").forEach(el => { el.textContent = CONFIG.TERMS_VERSION; });
if (CONFIG.TEST_MODE) $("demo").style.display = "block";
if (CONFIG.NEED_CODE) $("code-f").style.display = "block";
if (CONFIG.RULES_URL) { $("rules").style.display = "block"; $("rules-link").href = CONFIG.RULES_URL; }
const urlLang = new URLSearchParams(location.search).get("lang");
setLang(urlLang || (navigator.language || "fr").slice(0, 2));
</script>
