<title>OpenFab Membres</title>

<meta name="robots" content="noindex">
<style>
/* Layout: a one-screen app. One role at a time (tabs), one instruction at a time (guide bar), two panes (what there is / what you do), and a strip that says what just changed. Syntonie's form palette: navy ink on graph paper, one orange. */
:root{
  --paper:#F3EEE3; --sheet:#FBF8F1; --sunk:#ECE6D8;
  --ink:#1B2A40; --navy:#14233A; --mid:#52607A; --line:#C9C2B2; --grid:rgba(20,35,58,.06);
  --orange:#E8831A; --orange-ink:#9A4E06; --orange-soft:#FBE8D3; --on-orange:#14233A;
  --ok:#2F6B3A; --ok-soft:#E3EFE3; --wait:#9A4E06; --wait-soft:#FBEBD8; --stop:#A8321F; --stop-soft:#F8E4DF;
  --fog:#E6E0D2; --fog-line:#D8D1C0;
  --f-body:"Atkinson Hyperlegible",system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;
  --f-mono:ui-monospace,"SF Mono","Cascadia Mono","DejaVu Sans Mono",Menlo,monospace;
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --paper:#0F1724; --sheet:#162133; --sunk:#0B121D;
    --ink:#E8E2D4; --navy:#D9D2C2; --mid:#A3AABA; --line:#2E3B52; --grid:rgba(232,226,212,.05);
    --orange:#F0953A; --orange-ink:#F4AE66; --orange-soft:rgba(240,149,58,.16);
    --ok:#8FC79A; --ok-soft:rgba(143,199,154,.14); --wait:#F4AE66; --wait-soft:rgba(244,174,102,.14); --stop:#EE9583; --stop-soft:rgba(238,149,131,.14);
    --fog:#1A2536; --fog-line:#243248;
    color-scheme:dark;
  }
}
:root[data-theme="dark"]{
  --paper:#0F1724; --sheet:#162133; --sunk:#0B121D;
  --ink:#E8E2D4; --navy:#D9D2C2; --mid:#A3AABA; --line:#2E3B52; --grid:rgba(232,226,212,.05);
  --orange:#F0953A; --orange-ink:#F4AE66; --orange-soft:rgba(240,149,58,.16);
  --ok:#8FC79A; --ok-soft:rgba(143,199,154,.14); --wait:#F4AE66; --wait-soft:rgba(244,174,102,.14); --stop:#EE9583; --stop-soft:rgba(238,149,131,.14);
  --fog:#1A2536; --fog-line:#243248;
  color-scheme:dark;
}
*{box-sizing:border-box}
html,body{height:100%}
body{background-color:var(--paper);color:var(--ink);font:1rem/1.5 var(--f-body);
  background-image:linear-gradient(var(--grid) 1px,transparent 1px),linear-gradient(90deg,var(--grid) 1px,transparent 1px);background-size:60px 60px;
  padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));padding-block:0 12px}
.app{max-width:76rem;margin:0 auto;display:grid;gap:10px;grid-template-rows:auto auto minmax(0,1fr) auto;min-height:100%}
@media (min-width:56.01rem){.app{height:100%}}
:focus-visible{outline:3px solid var(--orange);outline-offset:2px}
button{font:inherit;cursor:pointer;color:var(--ink)}
h1,h2,h3,p{margin:0}
h2,h3{text-wrap:balance}

/* header: brand, roles, tools */
.top{display:flex;flex-wrap:wrap;gap:8px 16px;align-items:center;padding-top:10px}
.brand{display:flex;align-items:baseline;gap:8px}
.brand b{font-size:1.1rem}
.tag{font:.66rem/1 var(--f-mono);letter-spacing:.12em;text-transform:uppercase;border:1px dashed var(--mid);color:var(--mid);padding:4px 6px}
.roles{display:flex;border:1.5px solid var(--navy);flex:1 1 22rem;max-width:40rem}
.roles button{flex:1;background:var(--sheet);border:0;padding:9px 8px;font-size:.9rem;position:relative;min-width:0}
.roles button+button{border-left:1.5px solid var(--navy)}
.roles button[aria-selected="true"]{background:var(--navy);color:var(--paper);font-weight:700}
.roles .dot{position:absolute;top:5px;right:6px;width:10px;height:10px;border-radius:50%;background:var(--orange);border:1.5px solid var(--sheet)}
@media (prefers-reduced-motion:no-preference){.roles .dot{animation:pulse 1.2s ease-in-out infinite}}
@keyframes pulse{50%{transform:scale(1.5)}}
.tools{display:flex;gap:6px;margin-left:auto}
.small{background:transparent;border:1.5px solid var(--line);padding:6px 9px;font:.78rem/1 var(--f-mono)}
.small[aria-pressed="true"]{background:var(--navy);color:var(--paper);border-color:var(--navy)}

/* guide: the one thing to do next */
.guide{display:flex;flex-wrap:wrap;gap:8px 14px;align-items:center;background:var(--orange-soft);border:1.5px solid var(--orange);padding:9px 12px}
.guide .n{font:700 .75rem/1 var(--f-mono);color:var(--orange-ink);white-space:nowrap}
.guide p{flex:1 1 16rem;font-weight:700;min-width:0}
.guide.done{background:var(--ok-soft);border-color:var(--ok)}
.guide.done .n{color:var(--ok)}

/* stage: two panes */
.stage{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1fr);gap:14px;min-height:0}
.pane{background:var(--sheet);border:1.5px solid var(--navy);padding:14px 16px;min-width:0;min-height:0;overflow:auto;display:grid;gap:12px;align-content:start}
@media (max-width:56rem){.stage{grid-template-columns:1fr}.pane{overflow:visible}}
.pane > h2{font-size:.78rem;font-family:var(--f-mono);font-weight:400;letter-spacing:.1em;text-transform:uppercase;color:var(--mid)}
.pane h3{font-size:1.15rem}
.hint{font-size:.86rem;color:var(--mid)}
.row{display:flex;flex-wrap:wrap;gap:8px;align-items:center}

/* hex map */
svg.map{display:block;width:100%;height:auto;max-height:17rem}
.hex{cursor:pointer}
.hex polygon{stroke-width:1.5}
.hex text{font:600 10.5px var(--f-body);pointer-events:none;fill:var(--ink)}
.h-done polygon{fill:var(--ok-soft);stroke:var(--ok)}
.h-open polygon{fill:var(--sheet);stroke:var(--orange);stroke-width:3}
.h-wait polygon{fill:var(--wait-soft);stroke:var(--wait);stroke-dasharray:5 4}
.h-cue polygon{fill:var(--sunk);stroke:var(--mid);stroke-dasharray:4 4}
.h-cue text{fill:var(--mid);font-weight:400}
.h-fog{cursor:default}
.h-fog polygon{fill:var(--fog);stroke:var(--fog-line)}
.h-stop polygon{fill:var(--stop-soft);stroke:var(--stop);stroke-dasharray:3 3}
.hex.sel polygon{stroke:var(--navy);stroke-width:4.5;stroke-dasharray:none}
.hex:focus{outline:none}.hex:focus-visible polygon{stroke:var(--orange);stroke-width:5}
.legend{display:flex;flex-wrap:wrap;gap:3px 12px;font-size:.74rem;color:var(--mid)}
.legend span{display:inline-flex;gap:5px;align-items:center}
.sw{width:10px;height:10px;display:inline-block;border:1.5px solid}
.sw.done{background:var(--ok-soft);border-color:var(--ok)} .sw.open{background:var(--sheet);border-color:var(--orange)}
.sw.wait{background:var(--wait-soft);border:1.5px dashed var(--wait)} .sw.fog{background:var(--fog);border-color:var(--fog-line)}

/* controls */
.btn{background:var(--orange);color:var(--on-orange);border:2px solid var(--navy);padding:10px 15px;font-weight:700;box-shadow:3px 3px 0 var(--navy)}
.btn:disabled{opacity:.45;cursor:not-allowed}
.btn.alt{background:var(--sheet);color:var(--ink)}
.go{background:var(--navy);color:var(--paper);border:0;padding:8px 12px;font-weight:700;white-space:nowrap}
.sim{background:transparent;color:var(--mid);border:1.5px dashed var(--mid);padding:7px 10px;font-size:.84rem}
.check{display:flex;gap:10px;align-items:flex-start}
.check input{width:22px;height:22px;flex:none;accent-color:var(--navy);margin-top:1px}
.fork{display:grid;grid-template-columns:1fr 1fr;gap:8px}
@media (max-width:30rem){.fork{grid-template-columns:1fr}}
.fork button{text-align:left;background:var(--paper);border:1.5px solid var(--navy);padding:11px;display:grid;gap:3px;line-height:1.3}
.fork button span{font-size:.8rem;color:var(--mid)}
.card{background:var(--paper);border:1px solid var(--line);padding:10px 12px;display:grid;gap:4px;font-size:.92rem}
.card dl{display:grid;grid-template-columns:auto minmax(0,1fr);gap:2px 12px;margin:0}
.card dt{font:.7rem/1.9 var(--f-mono);text-transform:uppercase;letter-spacing:.05em;color:var(--mid)}
.card dd{margin:0;overflow-wrap:anywhere}
.qr{width:92px;height:92px;flex:none;border:1.5px solid var(--navy);background:
  conic-gradient(var(--navy) 25%,transparent 0 50%,var(--navy) 0 75%,transparent 0) 0 0/14px 14px,var(--sheet)}
.gate{border:2px solid;padding:12px;text-align:center;font-weight:700}
.gate.ok{background:var(--ok-soft);border-color:var(--ok);color:var(--ok)}
.gate.no{background:var(--stop-soft);border-color:var(--stop);color:var(--stop)}

/* chips, lists */
.chip{display:inline-block;font:600 .68rem/1 var(--f-mono);letter-spacing:.05em;text-transform:uppercase;padding:4px 7px;border:1.5px solid;white-space:nowrap}
.c-ok{color:var(--ok);background:var(--ok-soft)}
.c-wait{color:var(--wait);background:var(--wait-soft);border-style:dashed}
.c-off{color:var(--stop);background:var(--stop-soft);border-style:dashed}
.c-lapsed{color:var(--mid);background:transparent;border-style:dashed}
.count{font:.82rem/1.3 var(--f-mono);color:var(--mid);font-variant-numeric:tabular-nums}
.count b{color:var(--ink);font-size:1.3rem;font-family:var(--f-body)}
.list{list-style:none;margin:0;padding:0;display:grid;gap:6px}
.item{display:grid;grid-template-columns:minmax(0,1fr) auto;gap:2px 10px;align-items:center;width:100%;text-align:left;background:var(--paper);border:1.5px solid var(--line);padding:9px 11px}
.item[aria-current="true"]{border-color:var(--navy);border-width:2.5px}
.item small{grid-column:1/-1;font-size:.8rem;color:var(--mid)}
.item.new{box-shadow:inset 5px 0 var(--orange)}
.conds{list-style:none;margin:0;padding:0;display:grid;gap:5px}
.conds li{display:grid;grid-template-columns:1.4rem 1fr;gap:8px;align-items:baseline}
.conds i{font:normal 700 .78rem/1.25rem var(--f-mono);width:1.25rem;height:1.25rem;text-align:center;border:1.5px solid var(--line)}
.conds .y i{background:var(--ok-soft);border-color:var(--ok);color:var(--ok)}
.conds .n i{border-style:dashed;border-color:var(--wait);color:var(--wait)}

/* what just changed */
.changed{display:grid;grid-template-columns:auto minmax(0,1fr) auto;gap:6px 14px;align-items:center;background:var(--sheet);border:1.5px solid var(--navy);border-left:8px solid var(--ok);padding:9px 12px}
.changed .k{font:.68rem/1.2 var(--f-mono);letter-spacing:.1em;text-transform:uppercase;color:var(--mid)}
.changed .was{color:var(--mid);text-decoration:line-through;text-decoration-thickness:1px;font-size:.88rem}
.changed .now{font-weight:700}
.changed.empty{border-left-color:var(--line)}
@media (max-width:40rem){.changed{grid-template-columns:1fr}}
@media (prefers-reduced-motion:no-preference){.changed.fresh{animation:land .9s ease-out}}
@keyframes land{from{background:var(--ok-soft);transform:translateY(6px)}to{background:var(--sheet);transform:none}}

/* summary */
.cards{display:grid;grid-template-columns:repeat(auto-fill,minmax(min(100%,15rem),1fr));gap:8px}
.ins{border:1.5px solid var(--ok);background:var(--ok-soft);padding:9px 11px;display:grid;gap:3px;align-content:start}
.ins .was{font-size:.82rem;color:var(--mid);text-decoration:line-through;text-decoration-thickness:1px}
.ins .now{font-weight:700;font-size:.95rem}
.ins.fogged{border:1.5px dashed var(--fog-line);background:var(--fog);color:var(--mid);min-height:4.2rem;place-content:center;text-align:center;font-size:.82rem}
.keep{list-style:none;margin:0;padding:0;display:grid;gap:6px;font-size:.92rem}
.keep li{padding-left:14px;border-left:3px solid var(--navy)}
details summary{cursor:pointer;font-weight:700}
pre{margin:8px 0 0;font:.72rem/1.5 var(--f-mono);background:var(--sunk);padding:10px;overflow-x:auto}
.foot{font-size:.76rem;color:var(--mid)}
</style>

  ["door",   {fr:["Accès à l'atelier par confiance.","La porte vérifie l'adhésion."], en:["Workshop access on trust.","The door checks the membership."]}],
  ["skill",  {fr:["Personne ne sait qui est formé à quoi.","La formation est notée, la machine s'ouvre."], en:["Nobody knows who is trained on what.","The induction is recorded, the machine opens."]}],
  ["lapse",  {fr:["Une promesse de virement jamais tenue.","La demande s'éteint seule, rien à annuler."], en:["A promised transfer that never comes.","The request expires by itself, nothing to cancel."]}],
  ["year",   {fr:["Un contrôle des cotisations par an, à la main.","Au 1er janvier, chacun repasse « à renouveler »."], en:["Fees checked once a year, by hand.","On 1 January everyone goes back to \"to renew\"."]}],
];
const KEEP = {
  fr:["Zoho Books reste la comptabilité : aucun lien automatique.","La trésorerie décide : accepter reste un geste humain.","Le papier reste possible.","Année civile, cotisation de 25 €.","Chaque rôle a son mode d'emploi écrit."],
  en:["Zoho Books stays the books: no automatic link.","The treasurer decides: accepting stays a human action.","Paper stays possible.","Calendar year, €25 fee.","Each role has its own written guide."],
};

/* ---------- state ---------- */
const Y0 = 2026;
function fresh(){ return {
  mode:"member", sel:"fiche", rules:false, fiche:false, pod:null, door:null, year:Y0, deskSel:null, treasSel:null, seen:[], last:null, freshIns:false,
  members:[
    { id:"amaury", name:"Amaury Lenoir", paid:{2026:1}, accepted:true, skills:["laser","cnc"] },
    { id:"sofia", name:"Sofia Ruiz", paid:{2026:1}, accepted:true, skills:[] },
    { id:"lina", name:"Lina Haddad", paid:{}, accepted:false, skills:[], declared:"tr", days:12 },
  ] }; }
let S = fresh(), lang = "fr";
const $ = id => document.getElementById(id);
const esc = s => String(s ?? "").replace(/[&<>"']/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
function t(k, v){ let s = T[lang][k] ?? T.fr[k] ?? k; if (v) s = s.replace(/\{(\w+)\}/g, (m, x) => v[x] ?? m); return s; }
const me = () => S.members.find(m => m.id === "ines");
const status = m => m.lapsed ? "lapsed" : !m.accepted ? "wait" : m.paid[S.year] ? "ok" : "off";
const chip = st => `<span class="chip c-${st}">${esc(t("s_" + st))}</span>`;
const good = () => { const m = me(); return !!m && status(m) === "ok"; };
function see(id){ if (!S.seen.includes(id)) S.seen.push(id); S.last = id; S.freshIns = true; }

/* ---------- the guide ---------- */
function step(){
  const m = me();
  if (!S.fiche) return { n:1, mode:"member" };
  if (!S.pod) return { n:2, mode:"member" };
  if (!m) return { n:3, mode:"member" };
  if (m.lapsed) return null;
  if (!m.accepted) return { n:4, mode:"treas" };
  if (!S.seen.includes("status")) return { n:5, mode:"desk" };
  if (!S.seen.includes("door")) return { n:6, mode:"member" };
  return null;
}
function guideHtml(){
  const st = step();
  if (!st) return { cls:"guide done", html:`<span class="n">✓ ${esc(t("done_n"))}</span><p>${esc(t("g_done"))}</p>${S.mode !== "sum" ? `<button type="button" class="go" data-mode="sum">${esc(t("see_all"))}</button>` : ""}` };
  const away = st.mode !== S.mode, role = t("m_" + st.mode);
  return { cls:"guide", html:`<span class="n">${esc(t("step", { n:st.n }))}</span><p>${esc(away ? t("next_in", { role }) : t("g" + st.n))}</p>${away ? `<button type="button" class="go" data-mode="${st.mode}">${esc(t("go", { role }))} →</button>` : ""}` };
}

/* ---------- member ---------- */
const TILES = [["fiche",0,0],["pod",1,0],["join",2,-1],["door",2,0],["print",3,-1],["laser",3,0],["prepaid",4,-1],["network",4,0]];
function tileState(id){
  const m = me(), g = good(), live = m && !m.lapsed;
  switch (id){
    case "fiche": return S.fiche ? "done" : "open";
    case "pod": return S.pod ? "done" : S.fiche ? "open" : "fog";
    case "join": return !S.pod ? "fog" : !m ? "open" : m.lapsed ? "stop" : g ? "done" : m.accepted ? "stop" : "wait";
    case "door": return g ? (S.door === "ok" ? "done" : "open") : live ? "wait" : "fog";
    case "print": return g ? "open" : "fog";
    case "laser": return g ? (m.skills.includes("laser") ? "open" : "wait") : "fog";
    default: return g && S.seen.includes("door") ? "cue" : "fog";
  }
}
const HS = 46, R3 = Math.sqrt(3);
function hexPts(cx, cy){ const p = []; for (let i = 0; i < 6; i++){ const a = Math.PI / 180 * (60 * i - 30); p.push((cx + (HS - 3) * Math.cos(a)).toFixed(1) + "," + (cy + (HS - 3) * Math.sin(a)).toFixed(1)); } return p.join(" "); }
function lines(s, max){ const out = []; let l = ""; s.split(" ").forEach(w => { if ((l + " " + w).trim().length > max && l){ out.push(l); l = w; } else l = (l + " " + w).trim(); }); if (l) out.push(l); return out; }
function mapSvg(){
  const pts = TILES.map(([, q, r]) => [HS * R3 * (q + r / 2), HS * 1.5 * r]);
  const xs = pts.map(p => p[0]), ys = pts.map(p => p[1]);
  const x0 = Math.min(...xs) - HS, y0 = Math.min(...ys) - HS, w = Math.max(...xs) + HS - x0, h = Math.max(...ys) + HS - y0;
  const g = TILES.map(([id], i) => {
    const st = tileState(id), [cx, cy] = pts[i], fog = st === "fog";
    const label = fog ? "" : lines(t("t_" + id), 12).map((l, j, a) => `<text x="${cx.toFixed(1)}" y="${(cy + (j - (a.length - 1) / 2) * 12 + 4).toFixed(1)}" text-anchor="middle">${esc(l)}</text>`).join("");
    const tick = st === "done" ? `<text x="${cx.toFixed(1)}" y="${(cy - 22).toFixed(1)}" text-anchor="middle" style="fill:var(--ok);font-size:13px">✓</text>` : "";
    return `<g class="hex h-${st}${S.sel === id ? " sel" : ""}" ${fog ? 'aria-hidden="true"' : `role="button" tabindex="0" aria-label="${esc(t("t_" + id))}" data-tile="${id}"`}><polygon points="${hexPts(cx, cy)}"/>${label}${tick}</g>`;
  }).join("");
  return `<svg class="map" viewBox="${x0.toFixed(0)} ${y0.toFixed(0)} ${w.toFixed(0)} ${h.toFixed(0)}" role="group" aria-label="${esc(t("p_map"))}">${g}</svg>
    <div class="legend"><span><i class="sw done"></i>${esc(t("lg_done"))}</span><span><i class="sw open"></i>${esc(t("lg_open"))}</span><span><i class="sw wait"></i>${esc(t("lg_wait"))}</span><span><i class="sw fog"></i>${esc(t("lg_fog"))}</span></div>`;
}
function condsHtml(m){
  const y = S.year, fee = m && m.paid[y] ? "fee_ok" : m && m.declared && !m.accepted ? "fee_declared" : "fee_todo";
  const li = (ok, label) => `<li class="${ok ? "y" : "n"}"><i>${ok ? "✓" : "…"}</i><span>${label}</span></li>`;
  return `<ul class="conds">${li(true, esc(t("c_info")))}${li(true, esc(t("c_rules")))}${li(fee === "fee_ok", `${esc(t("c_fee", { y }))} · ${esc(t(fee))}`)}</ul>`;
}
function memberDo(){
  const id = S.sel, m = me(), y = S.year, h = k => `<h3>${esc(t(k))}</h3>`;
  if (id === "fiche") return h("t_fiche") + `<div class="card"><dl><dt>${esc(t("name"))}</dt><dd>Inès Moreau</dd><dt>${esc(t("email"))}</dt><dd>ines@example.org</dd><dt>${esc(t("likes"))}</dt><dd>bois, laser</dd></dl></div>` +
    (S.fiche ? `<p>✓ ${esc(t("fiche_ok"))}</p>` : `<label class="check"><input type="checkbox" id="rules"${S.rules ? " checked" : ""}><span>${esc(t("rules"))}</span></label><div class="row"><button class="btn" type="button" id="send"${S.rules ? "" : " disabled"}>${esc(t("send"))}</button></div>`);
  if (id === "pod") return h("pod_q") + (S.pod ? `<p>✓ ${esc(t("pod_ok"))}</p>` : `<div class="fork"><button type="button" data-pod="sy"><b>${esc(t("pod_sy"))}</b><span>${esc(t("pod_sy_s"))}</span></button><button type="button" data-pod="self"><b>${esc(t("pod_self"))}</b><span>${esc(t("pod_self_s"))}</span></button></div>`);
  if (id === "join"){
    let b = condsHtml(m);
    if (!m) b += `<div class="row"><div class="qr" aria-hidden="true"></div><p class="hint" style="flex:1 1 10rem">${esc(t("qr"))}</p></div><div class="row"><button class="btn" type="button" data-declare="tr">${esc(t("paid_tr"))}</button><button class="btn alt" type="button" data-declare="desk">${esc(t("paid_desk"))}</button></div>`;
    else b += `<p>${esc(m.lapsed ? t("join_lapsed") : good() ? t("join_ok", { y }) : m.accepted ? t("join_off", { y }) : t("join_wait"))}</p>`;
    return h("join_q") + b;
  }
  if (id === "door") return h("door_q") + (m && !m.lapsed ? `<div class="row"><button class="btn" type="button" id="door">${esc(t("door_btn"))}</button></div>` : "") + (S.door ? `<div class="gate ${S.door}" role="status">${esc(t("door_" + S.door))}</div>` : "");
  if (id === "print") return h("print_q") + `<p>${esc(good() ? t("print_p") : t("locked"))}</p>`;
  if (id === "laser") return h("laser_q") + `<p>${esc(!good() ? t("locked") : m.skills.includes("laser") ? t("laser_ok") : t("laser_need"))}</p>`;
  return `<h3>${esc(t("t_" + id))}</h3><p>${esc(t("later_" + id))}</p>`;
}

/* ---------- front desk ---------- */
function deskLeft(){
  const c = { ok:0, wait:0, off:0 }; S.members.forEach(m => { const s = status(m); if (s in c) c[s]++; });
  return `<p class="count">${t("desk_count", { ok:`<b>${c.ok}</b>`, wait:`<b>${c.wait}</b>`, off:`<b>${c.off}</b>` })}</p><ul class="list">` +
    S.members.filter(m => !m.lapsed).map(m => `<li><button type="button" class="item${m.id === "ines" ? " new" : ""}" data-desk="${m.id}" aria-current="${S.deskSel === m.id}"><b>${esc(m.name)}</b>${chip(status(m))}</button></li>`).join("") + `</ul><p class="hint">${esc(t("desk_hint"))}</p>`;
}
function deskRight(){
  const m = S.members.find(x => x.id === S.deskSel && !x.lapsed);
  if (!m) return `<p class="hint">${esc(t("pick"))}</p>`;
  const st = status(m), sk = m.skills.map(s => t(s)).join(", ") || t("none");
  return `<h3>${esc(m.name)}</h3><div class="card"><dl><dt>${esc(t("status"))}</dt><dd>${chip(st)}</dd>${st === "ok" ? `<dt>${esc(t("until"))}</dt><dd>31/12/${S.year}</dd>` : ""}<dt>${esc(t("skills"))}</dt><dd>${esc(sk)}</dd></dl></div>` +
    (st === "wait" ? `<p>${esc(t("desk_wait"))}</p>` : st === "off" ? `<p>${esc(t("desk_off", { y:S.year }))}</p>` : "") +
    (st === "ok" && !m.skills.includes("laser") && !step() ? `<div class="row"><button class="sim" type="button" data-train="${m.id}">${esc(t("train"))}</button></div>` : "");
}

/* ---------- treasurer ---------- */
function treasLeft(){
  const live = S.members.filter(m => !m.lapsed), y = S.year;
  return `<p class="count">${t("treas_count", { y, paid:`<b>${live.filter(m => m.paid[y]).length}</b>`, all:`<b>${live.length}</b>` })}</p><ul class="list">` +
    S.members.map(m => { const st = status(m); return `<li><button type="button" class="item${st === "wait" ? " new" : ""}" data-treas="${m.id}" aria-current="${S.treasSel === m.id}"><b>${esc(m.name)}</b>${chip(st)}${st === "wait" ? `<small>${esc(t("declared"))} : ${esc(t("by_" + m.declared))}${m.days ? " · " + esc(t("days", { n:m.days })) : ""}</small>` : ""}</button></li>`; }).join("") + `</ul>` +
    (!step() ? `<div class="row"><button class="sim" type="button" id="year">${esc(t("year", { y:S.year + 1 }))}</button></div>` : "");
}
function treasRight(){
  const m = S.members.find(x => x.id === S.treasSel), y = S.year;
  if (!m) return `<p class="hint">${esc(t("pick"))}</p>`;
  const st = status(m); let b = "";
  if (st === "wait") b = `<div class="card"><dl><dt>${esc(t("declared"))}</dt><dd>${esc(t("by_" + m.declared))}${m.days ? " · " + esc(t("days", { n:m.days })) : ""}</dd></dl></div><div class="row"><button class="btn" type="button" data-accept="${m.id}">${esc(t("accept"))}</button></div><div class="row"><button class="sim" type="button" data-lapse="${m.id}">${esc(t("lapse"))}</button></div>`;
  else if (st === "off") b = `<div class="row"><button class="btn" type="button" data-renew="${m.id}">${esc(t("renew", { y }))}</button></div>`;
  else if (st === "lapsed") b = `<p>${esc(t("lapsed_note"))}</p>`;
  else if (m.fresh) b = `<p>✓ ${esc(t("zoho"))}</p>`;
  return `<h3>${esc(m.name)} ${chip(st)}</h3>${b}`;
}

/* ---------- summary ---------- */
function sumLeft(){
  return `<p class="count"><b>${S.seen.length}</b> ${esc(t("seen", { all:INS.length }))}</p><div class="cards">` +
    INS.map(([id, w]) => S.seen.includes(id) ? `<div class="ins"><span class="was">${esc(w[lang][0])}</span><span class="now">${esc(w[lang][1])}</span></div>` : `<div class="ins fogged">${esc(t("fog"))}</div>`).join("") + `</div>`;
}
function sumRight(){
  const m = me(), web = "https://ines-moreau.pod.syntonie.be/profile/card#me";
  const files = `# Espace d'Inès · profile/card
<${web}> foaf:name "Inès Moreau" ;
    vcard:hasEmail <mailto:ines@example.org>${m && !m.lapsed ? ` ;
    org:memberOf <https://openfab.pod.syntonie.be/#org>` : ""} .

# Espace d'OpenFab · config.ttl (conditions, brouillon)
<#openfab> sy:joinConditions sy:BasicDetails , sy:HouseRules ,
    [ sy:fee 25 ; sy:period sy:CalendarYear ] .

# Espace d'OpenFab · membres.ttl (statut seul)
` + S.members.filter(x => x.accepted && !x.lapsed).map(x => `[] org:member <…/${x.id}> ; sy:status sy:${status(x) === "ok" ? "InGoodStanding" : "ToRenew"}${x.skills.length ? " ; sy:inducted " + x.skills.map(s => "sy:" + s).join(", ") : ""} .`).join("\n");
  return `<ul class="keep">${KEEP[lang].map(k => `<li>${esc(k)}</li>`).join("")}</ul><details><summary>${esc(t("files"))}</summary><pre>${esc(files)}</pre></details><p class="foot">${esc(t("foot"))}</p>`;
}

/* ---------- render ---------- */
const MODES = ["member","desk","treas","sum"];
function render(){
  document.documentElement.lang = lang;
  $("reset").textContent = t("reset");
  document.querySelectorAll("[data-lang]").forEach(b => b.setAttribute("aria-pressed", String(b.dataset.lang === lang)));
  const st = step();
  $("roles").innerHTML = MODES.map(m => `<button type="button" role="tab" data-mode="${m}" aria-selected="${S.mode === m}">${esc(t("m_" + m))}${st && st.mode === m && S.mode !== m ? '<i class="dot" aria-hidden="true"></i>' : ""}</button>`).join("");
  const g = guideHtml(); $("guide").className = g.cls; $("guide").innerHTML = g.html;
  const pane = (title, body) => `<section class="pane"><h2>${esc(t(title))}</h2>${body}</section>`;
  $("stage").innerHTML = S.mode === "member" ? pane("p_map", mapSvg()) + pane("p_do", memberDo())
    : S.mode === "desk" ? pane("p_list", deskLeft()) + pane("p_detail", deskRight())
    : S.mode === "treas" ? pane("p_req", treasLeft()) + pane("p_detail", treasRight())
    : pane("p_what", sumLeft()) + pane("p_keep", sumRight());
  const c = $("changed"), w = S.last && INS.find(x => x[0] === S.last)[1][lang];
  c.className = "changed" + (w ? "" : " empty") + (S.freshIns ? " fresh" : "");
  c.innerHTML = w ? `<span class="k">${esc(t("p_what"))}</span><span><span class="was">${esc(w[0])}</span><br><span class="now">→ ${esc(w[1])}</span></span><button type="button" class="small" data-mode="sum">${S.seen.length}/${INS.length}</button>`
    : `<span class="k">${esc(t("p_what"))}</span><span class="hint">${esc(t("nothing"))}</span><span></span>`;
  S.freshIns = false;
}

/* ---------- actions ---------- */
document.addEventListener("click", e => {
  const el = e.target.closest("button,[data-tile]"); if (!el) return;
  const d = el.dataset, find = id => S.members.find(m => m.id === id);
  if (d.lang) lang = d.lang;
  else if (el.id === "reset") S = fresh();
  else if (d.mode) S.mode = d.mode;
  else if (d.tile) S.sel = d.tile;
  else if (el.id === "send"){ S.fiche = true; S.sel = "pod"; see("form"); }
  else if (d.pod){ S.pod = d.pod; S.sel = "join"; see("data"); }
  else if (d.declare){ S.members.push({ id:"ines", name:"Inès Moreau", paid:{}, accepted:false, skills:[], declared:d.declare }); S.treasSel = "ines"; see("commit"); }
  else if (d.accept){ const m = find(d.accept); m.accepted = true; m.paid[S.year] = 1; m.fresh = true; if (m.id === "ines") S.sel = "door"; see("invoice"); }
  else if (d.lapse){ const m = find(d.lapse); m.lapsed = true; if (S.deskSel === m.id) S.deskSel = null; see("lapse"); }
  else if (d.renew){ find(d.renew).paid[S.year] = 1; }
  else if (d.desk){ S.deskSel = d.desk; if (d.desk === "ines" && good()) see("status"); }
  else if (d.treas) S.treasSel = d.treas;
  else if (d.train){ find(d.train).skills.push("laser"); see("skill"); }
  else if (el.id === "door"){ S.door = good() ? "ok" : "no"; if (S.door === "ok") see("door"); }
  else if (el.id === "year"){ S.year += 1; S.door = null; S.members.forEach(m => { m.fresh = false; }); see("year"); }
  else return;
  render();
});
document.addEventListener("keydown", e => {
  const g = e.target.closest && e.target.closest("[data-tile]");
  if (g && (e.key === "Enter" || e.key === " ")){ e.preventDefault(); S.sel = g.dataset.tile; render(); const n = document.querySelector(`[data-tile="${S.sel}"]`); if (n) n.focus(); }
});
document.addEventListener("change", e => { if (e.target.id === "rules"){ S.rules = e.target.checked; $("send").disabled = !S.rules; } });
render();
</script>
